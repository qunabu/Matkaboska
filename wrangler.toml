name = "meal-planner"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "e17e41cc82bda15dfa63960aa172fb87"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "meal-planner-db"
database_id = "50adfe28-424d-4102-868a-e37a2e848023"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "dae0613d015d49df860352b55e62e573"

[vars]
APP_VERSION = "dev"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
VAPID_PUBLIC_KEY = ""
ACCESS_AUD = ""
ACCESS_TEAM_DOMAIN = ""

[triggers]
crons = ["*/15 * * * *"]
