name = "meal-planner"
main = "src/worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b754865d6ccf05c90d33e35f213c7214"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "meal-planner-db"
database_id = "94ac6488-e034-44ee-8f16-cd31e43c03c9"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "05153056f66c4668ac86a2b354b3b31f"

# Workers AI — used for server-side voice-note transcription (Whisper).
[ai]
binding = "AI"

[vars]
# No APP_VERSION here — the release id lives in the generated src/shared/build-info.ts
# (see scripts/gen-build-info.mjs), so it is correct no matter how the deploy runs.
DEV_USER_EMAIL = "qunabu.com@gmail.com"
STARTER_RECIPES_USER = "qunabu.com@gmail.com"
ADMIN_EMAILS = "qunabu.com@gmail.com"
ANTHROPIC_MODEL = "claude-sonnet-4-6"
VAPID_PUBLIC_KEY = "BKq2zqGbmL2lz_d2G-rQhTGY6HwIL9rAk3ECLyhHufNBGhaH3kCSNTkw3OByN7nhE3a7MAL_r3yAzdfkx-6y_ug"
VAPID_SUBJECT = "mailto:qunabu.com@gmail.com"
# Google OAuth (client id/secret are Worker secrets). Access is OPEN: both lists
# empty = any Google account may sign in (anyone with the link). Each account is
# an isolated tenant (data scoped by user_id). To restrict later, list emails in
# ALLOWED_GOOGLE_EMAILS or domains in ALLOWED_GOOGLE_DOMAINS. No GOOGLE_HD.
ALLOWED_GOOGLE_DOMAINS = ""
ALLOWED_GOOGLE_EMAILS = ""

[triggers]
crons = ["*/15 * * * *"]
