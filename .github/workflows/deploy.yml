name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Apply any new D1 migrations before deploying the code that expects them.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply meal-planner-db --remote

      - name: Deploy
        run: npx wrangler deploy --var APP_VERSION:$(git rev-parse --short HEAD)
